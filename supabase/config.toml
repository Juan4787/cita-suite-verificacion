project_id = "turnos-saas"

[api]
enabled = true
port = 55421
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55422
major_version = 17

[studio]
enabled = true
port = 55423

[storage]
enabled = true
file_size_limit = "25MiB"

[analytics]
enabled = true
port = 55427

[inbucket]
enabled = true
port = 55424
smtp_port = 55425
pop3_port = 55426

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://localhost:5173/reset/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083
