name: Verificación de Cita Suite

# Manual only. This workflow never deploys or receives production credentials.
on:
  workflow_dispatch:
    inputs:
      level:
        description: Verification level against disposable local services
        type: choice
        required: true
        default: full
        options: [fast, full, types, sql]

permissions:
  contents: read

concurrency:
  group: cita-refactoring-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=1536
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Install pinned package manager and dependencies
        run: |
          npm install --global pnpm@10.13.1
          pnpm install --frozen-lockfile --network-concurrency=1
      - name: Validate hosted resources
        if: inputs.level != 'fast'
        run: |
          node --input-type=module - <<'JS'
          import os from 'node:os';
          import { statfsSync } from 'node:fs';
          const disk = statfsSync('.');
          if (os.totalmem() < 12 * 1024 ** 3 || os.cpus().length < 4 || disk.bavail * disk.bsize < 6 * 1024 ** 3)
            throw new Error('Insufficient disposable runner resources. No database load started.');
          console.log(JSON.stringify({cpu: os.cpus().length, memoryBytes: os.totalmem(), availableDiskBytes: disk.bavail * disk.bsize}));
          JS
      - name: Prepare disposable service images
        if: inputs.level != 'fast'
        run: |
          node scripts/prepare-ci-services.mjs
      - name: Prepare one browser
        if: inputs.level == 'full'
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Prepare pinned native spreadsheet reader
        if: inputs.level == 'full'
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends libreoffice-calc=4:24.2.7-0ubuntu0.24.04.7
          mkdir -p .verification
          dpkg-query -W -f='${Package} ${Version}\n' libreoffice-calc libreoffice-core libreoffice-common > .verification/office-toolchain.log
          /usr/bin/libreoffice --version >> .verification/office-toolchain.log
          sha256sum /usr/lib/libreoffice/program/soffice.bin >> .verification/office-toolchain.log
      - name: Verify sequentially
        env:
          VERIFICATION_LEVEL: ${{ inputs.level }}
        run: |
          case "$VERIFICATION_LEVEL" in
            fast|full) pnpm "verify:$VERIFICATION_LEVEL" ;;
            types) node scripts/run-campaign-type-generation.mjs ;;
            sql) node scripts/run-campaign-type-generation.mjs --verify-sql ;;
            *) exit 2 ;;
          esac
      - name: Retain verification evidence
        if: always()
        # Standard public runners and their logs are free. Keep the evidence in
        # bounded logs rather than consuming the account's billed artifact pool.
        run: python3 scripts/package-verification-evidence.py
