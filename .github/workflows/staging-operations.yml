name: Operaciones de staging de Cita Suite

# Manual only. Builds and bundles the release without deploying it: the Cloudflare artifact, for
# staging and with the production configuration (a bundle needs no credentials), and Natalia's site
# for each. Operates only on the dedicated staging project. Production credentials are never
# available to this workflow; deployment to Cloudflare is done outside it.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Staging operation
        type: choice
        required: true
        options: [artifact, migrations, queue-seed, queue-seed-abandoned, queue-report, queue-cleanup, device-seed, device-report, device-cleanup,
          capacity-seed, capacity-measure, capacity-report, capacity-cleanup, backup-rehearsal, release-fixture]
      practices:
        description: Practices of the hosted capacity scenario (2, the launch; 5, the earlier rehearsal)
        type: choice
        required: false
        default: '2'
        options: ['2', '5']
      run_id:
        description: Run of the queue scenario or the device check, for report and cleanup
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: cita-refactoring-verification
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-24.04
    # The hosted capacity measurement runs three twelve-minute repetitions and the public phase.
    timeout-minutes: ${{ inputs.operation == 'capacity-measure' && 90 || 45 }}
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Install pinned package manager and dependencies
        if: inputs.operation == 'artifact' || inputs.operation == 'capacity-measure' || inputs.operation == 'backup-rehearsal'
        run: |
          npm install --global pnpm@10.13.1
          pnpm install --frozen-lockfile --network-concurrency=1
      # The release: the app bundled for staging and production, and Natalia's site for each.
      - name: Build and bundle the release without deploying it
        if: inputs.operation == 'artifact'
        env:
          CITA_BUILD_VERSION: ${{ github.sha }}
        run: node scripts/package-release-artifact.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.operation == 'artifact'
        with:
          name: cloudflare-staging-${{ github.sha }}
          path: |
            apps/web/.svelte-kit/cloudflare
            .verification/cloudflare-bundle
            .verification/cloudflare-bundle-production
            .verification/natalia-staging
            .verification/natalia-production
            .verification/cloudflare-bundle-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
      - name: Apply the versioned migrations to staging
        if: inputs.operation == 'migrations'
        env:
          CITA_STAGING_DATABASE_URL: ${{ secrets.CITA_STAGING_DATABASE_URL }}
        run: node scripts/apply-staging-migrations.mjs
      - name: Operate the queue scenario of one run
        if: startsWith(inputs.operation, 'queue-')
        env:
          CITA_STAGING_DATABASE_URL: ${{ secrets.CITA_STAGING_DATABASE_URL }}
          OPERATION: ${{ inputs.operation }}
          RUN_ID: ${{ inputs.run_id }}
        run: node scripts/staging-queue-scenario.mjs "${OPERATION#queue-}" "$RUN_ID"
      # Capacity scenario against the deployed staging, from this runner.
      - name: Operate the hosted capacity scenario
        if: startsWith(inputs.operation, 'capacity-')
        env:
          CITA_STAGING_DATABASE_URL: ${{ secrets.CITA_STAGING_DATABASE_URL }}
          CITA_STAGING_SERVICE_ROLE_KEY: ${{ secrets.CITA_STAGING_SERVICE_ROLE_KEY }}
          OPERATION: ${{ inputs.operation }}
          CITA_STAGING_CAPACITY_PRACTICES: ${{ inputs.practices }}
        run: node scripts/staging-capacity.mjs "${OPERATION#capacity-}"
      # Synthetic data and aggregated measurements only; kept also when the measurement fails.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && (inputs.operation == 'capacity-seed' || inputs.operation == 'capacity-measure' || inputs.operation == 'capacity-report')
        with:
          name: staging-${{ inputs.operation }}-${{ github.run_id }}
          path: .verification/staging-capacity-*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      # The Free plan has no managed daily backups: rehearse the documented dump and restore
      # of staging into an isolated, empty database of the hosted version on this runner.
      - name: Rehearse the backup and restore of staging in an isolated database
        if: inputs.operation == 'backup-rehearsal'
        env:
          CITA_STAGING_DATABASE_URL: ${{ secrets.CITA_STAGING_DATABASE_URL }}
          CITA_STAGING_SERVICE_ROLE_KEY: ${{ secrets.CITA_STAGING_SERVICE_ROLE_KEY }}
        run: node scripts/backup-rehearsal.mjs
      # The management link of the device check is read on the local machine only.
      - name: Operate the real-device push check of one run
        if: startsWith(inputs.operation, 'device-')
        env:
          CITA_STAGING_DATABASE_URL: ${{ secrets.CITA_STAGING_DATABASE_URL }}
          OPERATION: ${{ inputs.operation }}
          RUN_ID: ${{ inputs.run_id }}
        run: node scripts/staging-device-push.mjs "${OPERATION#device-}" "$RUN_ID"
      # The synthetic practice Natalia's staging copy books into during the release verification.
      - name: Ensure the release practice of staging
        if: inputs.operation == 'release-fixture'
        env:
          CITA_STAGING_DATABASE_URL: ${{ secrets.CITA_STAGING_DATABASE_URL }}
        run: node scripts/staging-release-fixture.mjs
