<!doctype html>
<html lang="es" class="%cita.theme.class%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Modo de color: el servidor completa la clase de <html> y el color de la barra del navegador
		     con la cookie cita-theme (src/lib/theme/preference.ts, hooks.server.ts). Sin elección: claro. -->
		%cita.theme.meta%
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<link rel="icon" type="image/png" href="/logo-cita-suite.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap">
		<div class="app-shell">%sveltekit.body%</div>
	</body>
</html>
